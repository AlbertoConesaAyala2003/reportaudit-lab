name: Publicar versión firmada

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Release - SBOM y procedencia
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Descargar el código de la etiqueta
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generar el inventario CycloneDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: reportaudit-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Empaquetar el código fuente y calcular las huellas
        run: |
          mkdir -p dist
          mv reportaudit-sbom.cdx.json dist/
          git archive --format=tar.gz --prefix="reportaudit-${VERSION#v}/" \
            -o "dist/reportaudit-${VERSION#v}.tar.gz" HEAD
          cd dist
          sha256sum reportaudit-*.tar.gz reportaudit-sbom.cdx.json > SHA256SUMS

      - name: Atestar la procedencia del paquete
        id: procedencia
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/reportaudit-*.tar.gz

      - name: Atestar el inventario del paquete
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/reportaudit-*.tar.gz
          sbom-path: dist/reportaudit-sbom.cdx.json

      - name: Guardar las firmas y publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.procedencia.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/reportaudit-provenance.sigstore.json
          cp "$SBOM_BUNDLE" dist/reportaudit-sbom.sigstore.json
          gh release create "$VERSION" dist/* --verify-tag \
            --title "ReportAudit $VERSION" \
            --notes "SBOM (CycloneDX), SHA-256 checksums and Sigstore attestations included. See SECURITY.md to verify."
